---
# file: .github/workflows/build.yaml

name: "Build and deploy homepage"

on:
  pull_request:
    branches: [main]
  
  push:
    branches: [main]
    tags: ['v*.*']

  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, ARM64]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Login to registry
        uses: docker/login-action@v7
        with:
          registry: registry.kellykemnitz.com:5000
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.kellykemnitz.com:5000/homepage
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      - name: Deploy
        working-directory: ${{ var.DOCKER_COMPOSE_DIR }}
        run: docker compose up -d --pull always homepage
